{% extends "auth_layout.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<h1>Sign up</h1>
<form method="post">
    {% csrf_token %}
    {{form.as_p}}
    <button class="btn btn-primary">Sign Up</button>
</form>
<h2 class="text-center">
    <a href="{% url "login" %}">I already have an account</a>
</h2>

{% endblock %}
