{% extends "layout.html" %}
{% block title %}
Chai aur tweet
{% endblock %}
{% block content %}

<h2>
    {%if form.instance.pk %} What's to change something? 
    {%else %} What's on your amazing mind?

</h2>
{% endblock %}
